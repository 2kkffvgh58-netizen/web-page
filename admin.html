<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Strategic Drive — Review Moderation</title><style>body{background:#090909;color:#eee;font:16px system-ui;max-width:850px;margin:50px auto;padding:20px}h1{color:#c6a76a}input,button{padding:12px;margin:6px;background:#171717;color:white;border:1px solid #c6a76a;border-radius:4px}button{cursor:pointer}article{border:1px solid #665334;padding:18px;margin:15px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#aaa}</style></head><body><h1>Customer Review Moderation</h1><p class="muted">Owner-only page. Enter your Cloudflare REVIEW_ADMIN_TOKEN. It is kept in this browser tab's memory only, not saved.</p><input type="password" id="token" placeholder="Admin token" autocomplete="off"><button id="load">Load Reviews</button><p id="status" role="status"></p><div id="items"></div><script>
let token='';const status=document.getElementById('status'),items=document.getElementById('items');
async function request(method,body){const r=await fetch('/api/reviews/admin',{method,headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
async function load(){items.replaceChildren();status.textContent='Loading…';try{const data=await request('GET');status.textContent=data.reviews.length+' reviews found';for(const review of data.reviews){const card=document.createElement('article');const h=document.createElement('strong');h.textContent=review.name+' — '+review.rating+'/5 — '+review.status;const p=document.createElement('p');p.textContent=review.body;card.append(h,p);if(review.status==='pending'){const approve=document.createElement('button');approve.textContent='Approve';approve.onclick=()=>moderate(review.id,'approve');card.append(approve);}const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{if(confirm('Permanently delete this review?'))moderate(review.id,'delete')};card.append(del);items.append(card);}}catch(e){status.textContent=e.message;}}
async function moderate(id,action){try{await request('POST',{id,action});await load();}catch(e){status.textContent=e.message;}}
document.getElementById('load').onclick=()=>{token=document.getElementById('token').value.trim();document.getElementById('token').value='';load()};
</script></body></html>
